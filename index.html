<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema de Vendas</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="tela-login" class="tela-login">
    <form id="form-login" class="form-login">
      <h1>Sistema de Vendas</h1>
      <label for="email">E-mail</label>
      <input type="email" id="email" required autocomplete="email" />
      <label for="senha">Senha</label>
      <input type="password" id="senha" required autocomplete="current-password" />
      <button type="submit">Entrar</button>
      <p id="erro-login" class="erro"></p>
    </form>
  </div>

  <!-- APP -->
  <div id="app" class="app oculto">

    <header class="topbar">
      <span class="logo">Vendas</span>
      <span id="status-conexao" class="status">
        <span class="dot"></span> Verificando...
      </span>
      <span id="usuario-nome" class="usuario-nome"></span>
      <button id="btn-sair" class="btn-sair">Sair</button>
    </header>

    <aside class="sidebar">
      <nav class="menu">
        <a href="#inicio" data-rota="inicio">Início</a>
        <a href="#vendas" data-rota="vendas">Vendas</a>
        <a href="#reservas" data-rota="reservas">Reservas</a>
        <a href="#fiado" data-rota="fiado">Fiado</a>
        <a href="#produtos" data-rota="produtos" data-admin="true">Produtos</a>
        <a href="#historico" data-rota="historico" data-admin="true">Histórico</a>
        <a href="#usuarios" data-rota="usuarios" data-admin="true">Usuários</a>
      </nav>
    </aside>

    <main id="conteudo" class="conteudo"></main>

    <nav class="bottom-nav">
      <a href="#inicio" data-rota="inicio">Início</a>
      <a href="#vendas" data-rota="vendas">Vendas</a>
      <a href="#reservas" data-rota="reservas">Reservas</a>
      <a href="#fiado" data-rota="fiado">Fiado</a>
      <a href="#produtos" data-rota="produtos">Produtos</a>
    </nav>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
